[theme]
base = "dark"
primaryColor = "#3DDC97"
backgroundColor = "#0B0F0E"
secondaryBackgroundColor = "#151C19"
textColor = "#E8F0EC"
font = "sans serif"

[server]
# Required for Streamlit Community Cloud health checks (/healthz on :8501).
headless = true
enableStaticServing = true

[browser]
gatherUsageStats = false
